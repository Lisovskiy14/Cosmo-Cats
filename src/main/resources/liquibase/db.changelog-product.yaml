databaseChangeLog:
  - changeSet:
      id: lab-3-2
      author: lisovskiy14
      changes:

        # Create Table Products
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: "gen_random_uuid()"
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: products
            columnNames: name, category_id
            constraintName: uq_products_name_category
        - createIndex:
            tableName: products
            indexName: idx_products_name
            columns:
              - column:
                  name: name


        # Create Table Categories
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: "gen_random_uuid()"
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: categories
            columnNames: name
            constraintName: uq_categories_name
        - addUniqueConstraint:
            tableName: categories
            columnNames: slug
            constraintName: uq_categories_slug

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category_id